<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>media-demo</title>
    <style>
      :root {
        --bg: #f3f6f9;
        --surface: #ffffff;
        --ink: #14202e;
        --muted: #5b6b7c;
        --line: #d5dee7;
        --focus: #2f6fd6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1a2b;
          --surface: #16243a;
          --ink: #e6edf5;
          --muted: #93a4b8;
          --line: #26364f;
          --focus: #7fb0ff;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      main > p {
        margin: 8px 0 24px;
        color: var(--muted);
      }
      ul {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: block;
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        border-color: var(--muted);
      }
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      a strong {
        display: block;
      }
      a span {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>media-demo</h1>
      <p>Small browser media experiments.</p>
      <ul>
        <li>
          <a href="./waveform/">
            <strong>WebAudio Waveform</strong>
            <span>Decode an audio file, draw its peaks, click to seek.</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
